<!DOCTYPE html>
<html lang="en">
<head>
   // I created this page with deepseek prompting the objectives of the week3
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
	    background-image : url("indir.jpeg");
	    background-repeat : no-repeat;
	    background-size : cover;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 25px;
	    box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .highlight {
            background-color: #ffeb3b !important;
        }
        .active-input {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
    </style>
</head>
<body>
    <h1>Class Information</h1>
    <form id="classForm">
        <input type="text" id="className" placeholder="Class Name" required>
        <input type="number" id="numPeople" placeholder="Number of People" required>
        <textarea id="description" placeholder="Description" rows="3" required></textarea>
        <button type="submit">Add Class</button>
    </form>

    <table id="classTable">
        <thead>
            <tr>
                <th>Class Name</th>
                <th>Number of People</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be added dynamically -->
        </tbody>
    </table>

    <script>
        // JavaScript for dynamic table update and interactivity
        const form = document.getElementById('classForm');
        const tableBody = document.querySelector('#classTable tbody');

        // Form submit event: Add data to the table
        form.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent page reload

            // Get form data
            const className = document.getElementById('className').value;
            const numPeople = document.getElementById('numPeople').value;
            const description = document.getElementById('description').value;

            // Create a new table row
            const newRow = document.createElement('tr');

            // Add data to the row
            newRow.innerHTML = `
                <td>${className}</td>
                <td>${numPeople}</td>
                <td>${description}</td>
            `;

            // Add the row to the table
            tableBody.appendChild(newRow);

            // Clear the form
            form.reset();
        });

        // Input focus event: Highlight active input
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.classList.add('active-input');
            });
            input.addEventListener('blur', () => {
                input.classList.remove('active-input');
            });
        });

        // Row click event: Highlight row and log details
        tableBody.addEventListener('click', (event) => {
            const row = event.target.closest('tr');
            if (row) {
                // Remove highlight from all rows
                document.querySelectorAll('tr').forEach(r => r.classList.remove('highlight'));
                // Highlight the clicked row
                row.classList.add('highlight');

                // Log row details to the console
                const className = row.cells[0].textContent;
                const numPeople = row.cells[1].textContent;
                const description = row.cells[2].textContent;
                console.log(`Class Name: ${className}, Number of People: ${numPeople}, Description: ${description}`);
            }
        });

        // Table click event: Log all class entries
        document.getElementById('classTable').addEventListener('click', (event) => {
            if (event.target.tagName === 'TABLE') {
                const rows = Array.from(tableBody.querySelectorAll('tr'));
                const classEntries = rows.map(row => ({
                    className: row.cells[0].textContent,
                    numPeople: row.cells[1].textContent,
                    description: row.cells[2].textContent,
                }));
                console.log('All Class Entries:', classEntries);
            }
        });

        // Mouseover and mouseout events: Change row background color
        tableBody.addEventListener('mouseover', (event) => {
            const row = event.target.closest('tr');
            if (row) {
                row.style.backgroundColor = '#e0f7fa';
            }
        });
        tableBody.addEventListener('mouseout', (event) => {
            const row = event.target.closest('tr');
            if (row) {
                row.style.backgroundColor = '';
            }
        });

        // Double-click event: Remove a row
        tableBody.addEventListener('dblclick', (event) => {
            const row = event.target.closest('tr');
            if (row) {
                row.remove();
                console.log('Row removed:', row.cells[0].textContent);
            }
        });
    </script>
</body>
</html>
